<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .music-container {
            background: #252538;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .song-info {
            margin-bottom: 20px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artist {
            font-size: 14px;
            color: #a0a0b0;
        }

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            background: #4e44ce;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        button:hover {
            background: #6a5acd;
        }

        .playlist {
            text-align: left;
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #3e3e5c;
            padding-top: 10px;
        }

        .playlist-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .playlist-item:hover, .playlist-item.active {
            background: #3e3e5c;
            color: #00d2ff;
        }

        .links-section {
            margin-top: 20px;
            font-size: 14px;
        }

        .links-section a {
            color: #00d2ff;
            text-decoration: none;
        }

        .links-section a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="music-container">
        <h2>Music Player</h2>

        <div class="song-info">
            <div class="title" id="title">Song Title</div>
            <div class="artist" id="artist">Artist Name</div>
        </div>

        <audio id="audio"></audio>

        <div class="navigation">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
        </div>

        <div class="playlist" id="playlist">
            <!-- Playlist items will be dynamically generated here -->
        </div>

        <div class="links-section">
            <a href="calculator.html">Go to Calculator 🧮</a>
        </div>
    </div>

    <script>
        // ==========================================
        // 🎵 EDIT YOUR SONGS AND ARTISTS HERE:
        // ==========================================
        const songs = [
            {
                title: "Aarzu",
                artist: "Noor, Khan, Madhurxo",
                src: "song2.mpeg" 
            },
            {
                title: "Lover",
                artist: "Taylor Swift",
                src: "song1.mpeg" 
            },
            {
                title: "Aje Na Jaa",
                artist: "Simran Chaudary",
                src: "song3.mpeg" 
            }
        ];
        // ==========================================

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const playlistContainer = document.getElementById('playlist');

        let songIndex = 0;

        // Initially load song details into DOM
        loadSong(songs[songIndex]);

        function loadSong(song) {
            title.innerText = song.title;
            artist.innerText = song.artist;
            audio.src = song.src;
            renderPlaylist();
        }

        function playSong() {
            playBtn.innerText = '⏸';
            audio.play();
        }

        function pauseSong() {
            playBtn.innerText = '▶';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            const isPlaying = playBtn.innerText === '⏸';
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        });

        prevBtn.addEventListener('click', () => {
            songIndex--;
            if (songIndex < 0) {
                songIndex = songs.length - 1;
            }
            loadSong(songs[songIndex]);
            playSong();
        });

        nextBtn.addEventListener('click', () => {
            songIndex++;
            if (songIndex > songs.length - 1) {
                songIndex = 0;
            }
            loadSong(songs[songIndex]);
            playSong();
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === songIndex) {
                    item.classList.add('active');
                }
                item.innerText = `${index + 1}. ${song.title} - ${song.artist}`;
                item.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                });
                playlistContainer.appendChild(item);
            });
        }
    </script>
</body>
</html>
