<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .music-container {
            background: #252538;
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }

        .song-info {
            margin-bottom: 15px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artist {
            font-size: 14px;
            color: #a0a0b0;
        }

        /* Progress Bar Styling */
        .progress-container {
            background: #3e3e5c;
            border-radius: 5px;
            cursor: pointer;
            margin: 15px 0;
            height: 6px;
            width: 100%;
        }

        .progress {
            background: #00d2ff;
            border-radius: 5px;
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-container {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0a0b0;
            margin-bottom: 15px;
        }

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            background: #4e44ce;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        button:hover {
            background: #6a5acd;
        }

        .playlist {
            text-align: left;
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #3e3e5c;
            padding-top: 10px;
        }

        .playlist-item {
            padding: 8px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .playlist-item:hover, .playlist-item.active {
            background: #3e3e5c;
            color: #00d2ff;
        }
    </style>
</head>
<body>

    <div class="music-container">
        <h2>Music Player</h2>

        <div class="song-info">
            <div class="title" id="title">Song Title</div>
            <div class="artist" id="artist">Artist Name</div>
        </div>

        <audio id="audio"></audio>

        <!-- Progress Bar & Timer -->
        <div class="progress-container" id="progress-container">
            <div class="progress" id="progress"></div>
        </div>
        <div class="time-container">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="navigation">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
        </div>

        <div class="playlist" id="playlist"></div>
    </div>

    <script>
        const songs = [
            {
                title: "Aarzu",
                artist: "Noor, Khan, Madhurxo",
                src: "song2.mpeg"
            },
            {
                title: "Lover",
                artist: "Taylor Swift",
                src: "song1.mpeg"
            },
            {
                title: "Aje Na Jaa",
                artist: "Simran Chaudary",
                src: "song3.mpeg"
            }
        ];

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const playlistContainer = document.getElementById('playlist');
        const progressContainer = document.getElementById('progress-container');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');

        let songIndex = 0;

        loadSong(songs[songIndex]);

        function loadSong(song) {
            title.innerText = song.title;
            artist.innerText = song.artist;
            audio.src = song.src;
            renderPlaylist();
        }

        function playSong() {
            playBtn.innerText = '⏸';
            audio.play();
        }

        function pauseSong() {
            playBtn.innerText = '▶';
            audio.pause();
        }

        playBtn.addEventListener('click', () => {
            const isPlaying = playBtn.innerText === '⏸';
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        });

        prevBtn.addEventListener('click', () => {
            songIndex--;
            if (songIndex < 0) {
                songIndex = songs.length - 1;
            }
            loadSong(songs[songIndex]);
            playSong();
        });

        nextBtn.addEventListener('click', () => {
            songIndex++;
            if (songIndex > songs.length - 1) {
                songIndex = 0;
            }
            loadSong(songs[songIndex]);
            playSong();
        });

        // Update progress bar & time
        audio.addEventListener('timeupdate', (e) => {
            const { duration, currentTime } = e.srcElement;
            if (isNaN(duration)) return;
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;

            // Format current time
            let currentMinutes = Math.floor(currentTime / 60);
            let currentSeconds = Math.floor(currentTime % 60);
            if (currentSeconds < 10) currentSeconds = `0${currentSeconds}`;
            currentTimeEl.innerText = `${currentMinutes}:${currentSeconds}`;

            // Format total duration
            let durationMinutes = Math.floor(duration / 60);
            let durationSeconds = Math.floor(duration % 60);
            if (durationSeconds < 10) durationSeconds = `0${durationSeconds}`;
            durationEl.innerText = `${durationMinutes}:${durationSeconds}`;
        });

        // Click on progress bar to skip
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        // Auto play next song when current ends
        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.classList.add('playlist-item');
                if (index === songIndex) {
                    item.classList.add('active');
                }
                item.innerText = `${index + 1}. ${song.title} - ${song.artist}`;
                item.addEventListener('click', () => {
                    songIndex = index;
                    loadSong(songs[songIndex]);
                    playSong();
                });
                playlistContainer.appendChild(item);
            });
        }
    </script>
</body>
</html>
